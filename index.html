<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kohlsify</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #0a0a0a;
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        .card {
            max-width: 640px;
            width: 100%;
            background: #111;
            border-radius: 8px;
            padding: 2rem 1.8rem;
            border: 1px solid #262626;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .top-icon {
            width: 380px;
            max-width: 85%;
            height: auto;
            border-radius: 50%;
            background: #0a0a0a;
            padding: 8px;
            border: 2px solid #262626;
            margin: 0 auto 1rem;
            display: block;
        }

        .typed-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #e5e5e5;
            min-height: 2.7rem;
            margin-bottom: 1.5rem;
            font-family: 'Courier New', monospace;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 0.6rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.3rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: 'Consolas', monospace;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid #303030;
            background: #161616;
            color: #a3a3a3;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            min-width: 120px;
        }
        .btn:hover {
            background: #1f1f1f;
            border-color: #4a4a4a;
            color: #e5e5e5;
        }
        .btn-primary {
            background: #1a3d24;
            border-color: #2a5c38;
            color: #7fdf9a;
            font-size: 1rem;
            padding: 0.75rem 2rem;
            min-width: 160px;
        }
        .btn-primary:hover {
            background: #224d2e;
            border-color: #3a7a4a;
            color: #a8f0be;
        }

        .toast {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #555;
            min-height: 1.3rem;
            transition: color 0.3s;
        }
        .toast.show { color: #7fdf9a; }

        .terminal {
            background: #0d0d0d;
            border: 1px solid #262626;
            border-radius: 6px;
            overflow: hidden;
            text-align: left;
            max-width: 640px;
            width: 100%;
        }
        .terminal-header {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0.5rem 0.7rem;
            background: #161616;
            border-bottom: 1px solid #262626;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.r { background: #5c2a2a; }
        .dot.y { background: #5c4a2a; }
        .dot.g { background: #2a5c38; }
        .terminal-title {
            margin-left: 8px;
            font-size: 0.72rem;
            color: #555;
            letter-spacing: 1px;
        }
        .terminal-actions { margin-left: auto; }
        .terminal-btn {
            padding: 0.25rem 0.7rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-family: 'Consolas', monospace;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #303030;
            background: #1a1a1a;
            color: #a3a3a3;
            transition: background 0.15s, color 0.15s;
        }
        .terminal-btn:hover {
            background: #252525;
            color: #e5e5e5;
        }
        .terminal-btn.primary {
            background: #1a3d24;
            border-color: #2a5c38;
            color: #7fdf9a;
        }
        .terminal-btn.primary:hover {
            background: #224d2e;
            color: #a8f0be;
        }
        .terminal-body {
            padding: 1rem 1.2rem;
            font-family: 'Consolas', monospace;
            font-size: 0.82rem;
            color: #b0b0b0;
            min-height: 110px;
            line-height: 1.7;
            word-break: break-all;
        }
        .terminal-body .prompt { color: #5a8a6a; }
        .terminal-body .ok { color: #7fdf9a; }
        .cursor {
            display: inline-block;
            background: #a3a3a3;
            width: 8px;
            height: 1em;
            vertical-align: text-bottom;
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (max-width: 520px) {
            .card { padding: 1.2rem 0.9rem; }
            .typed-title { font-size: 1.6rem; letter-spacing: 2px; }
            .top-icon { width: 220px; }
            .btn { min-width: 100px; padding: 0.5rem 1rem; font-size: 0.75rem; }
            .btn-primary { min-width: 140px; font-size: 0.9rem; }
            .terminal-body { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="top-icon" src="https://github.com/minecraftfornpm/Web/raw/refs/heads/main/Kohlsify.png" alt="Kohlsify" />
        <h1 class="typed-title" id="typedTitle"></h1>

        <div class="btn-row">
            <a href="https://gist.githubusercontent.com/minecraftfornpm/c87c4be0b7b98f6a3cf37ae9e102b270/raw/4f1e0f365c2c52907bc38850eed0837eb8f73a9c/Kohlsify.lua" target="_blank" rel="noopener noreferrer" class="btn">see source</a>
            <button id="copyBtn" class="btn btn-primary">copy script</button>
        </div>
        <div class="btn-row">
            <a href="https://gist.githubusercontent.com/minecraftfornpm/f91d5f296e81cf89ba86ba8d4114602a/raw/14d11286ac767bbda0d942947dca3b189c244afa/Ui.lua" target="_blank" rel="noopener noreferrer" class="btn">see source (UI)</a>
        </div>

        <div id="toast" class="toast">copied</div>
    </div>

    <div class="terminal">
        <div class="terminal-header">
            <span class="dot r"></span>
            <span class="dot y"></span>
            <span class="dot g"></span>
            <span class="terminal-title">skid executor</span>
            <div class="terminal-actions">
                <button class="terminal-btn primary" id="termCopyBtn">copy</button>
            </div>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
    </div>

    <script>
        const SCRIPT_TEXT = `loadstring(game:HttpGet("https://gist.githubusercontent.com/minecraftfornpm/c87c4be0b7b98f6a3cf37ae9e102b270/raw/4f1e0f365c2c52907bc38850eed0837eb8f73a9c/Kohlsify.lua"))()`;

        (function() {
            const copyBtn = document.getElementById('copyBtn');
            const termCopyBtn = document.getElementById('termCopyBtn');
            const toast = document.getElementById('toast');
            let t = null;
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                if (t) clearTimeout(t);
                t = setTimeout(() => {
                    toast.classList.remove('show');
                    t = null;
                }, 2200);
            }
            function doCopy() {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(SCRIPT_TEXT).then(() => showToast('copied'));
                }
                return new Promise((resolve) => {
                    const ta = document.createElement('textarea');
                    ta.value = SCRIPT_TEXT;
                    document.body.appendChild(ta);
                    ta.select();
                    try {
                        document.execCommand('copy');
                        showToast('copied');
                    } catch (e) {
                        showToast('copy failed');
                    }
                    document.body.removeChild(ta);
                    resolve();
                });
            }
            copyBtn.addEventListener('click', doCopy);
            termCopyBtn.addEventListener('click', doCopy);
        })();

        function typeText(el, text, speed, cb) {
            let i = 0;
            el.textContent = '';
            const iv = setInterval(() => {
                if (i < text.length) {
                    el.textContent = text.substring(0, i + 1) + '_';
                    i++;
                } else {
                    el.textContent = text;
                    clearInterval(iv);
                    if (cb) cb();
                }
            }, speed);
        }

        const titleEl = document.getElementById('typedTitle');
        const titleObs = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    typeText(titleEl, 'KOHLSIFY', 160);
                    titleObs.unobserve(e.target);
                }
            });
        }, { threshold: 0.3 });
        titleObs.observe(titleEl);

        let started = false;
        function startTerminal() {
            if (started) return;
            started = true;
            const body = document.getElementById('terminalBody');
            const line = document.createElement('div');
            line.innerHTML = '<span class="prompt">$</span> ';
            body.appendChild(line);
            const codeSpan = document.createElement('span');
            line.appendChild(codeSpan);
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            line.appendChild(cursor);

            let i = 0;
            function typeCode() {
                if (i < SCRIPT_TEXT.length) {
                    codeSpan.textContent += SCRIPT_TEXT.charAt(i);
                    i++;
                    setTimeout(typeCode, 18);
                } else {
                    setTimeout(() => {
                        cursor.style.display = 'none';
                        const done = document.createElement('div');
                        done.innerHTML = '<span class="prompt">$</span> <span class="ok">script loaded</span>';
                        body.appendChild(done);
                    }, 400);
                }
            }
            typeCode();
        }

        const term = document.querySelector('.terminal');
        const termObs = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    startTerminal();
                    termObs.unobserve(e.target);
                }
            });
        }, { threshold: 0.3 });
        termObs.observe(term);
    </script>

</body>
</html>
