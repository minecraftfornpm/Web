<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kohlsify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            color: #c9d1d9;
            padding: 1rem;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            text-align: center;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0e6d0, #b8a7b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .desc {
            font-size: 1rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }
        .desc strong {
            color: #f0e6d0;
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            min-width: 150px;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-primary {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2ea043;
            border-color: #2ea043;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #21262d;
            border-color: #30363d;
        }
        .btn-secondary:hover {
            background: #30363d;
            border-color: #8b949e;
            transform: translateY(-2px);
        }
        .toast {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #8b949e;
            min-height: 1.5rem;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .toast.show {
            opacity: 1;
            color: #58a6ff;
        }
        @media (max-width: 480px) {
            .card { padding: 1.5rem 1rem; }
            h1 { font-size: 2rem; }
            .btn { min-width: 120px; padding: 0.6rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Kohlsify</h1>
        <p class="desc">
            Roblox script for place "Kohls Admin House X"<br>
            creator <strong>nowhud</strong> (nowhudhejeir in roblox)
        </p>
        <div class="btn-group">
            <a href="https://raw.githubusercontent.com/minecraftfornpm/Kohlsify/refs/heads/main/Kohlsify.lua" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="btn btn-secondary">See Source</a>
            <button id="copyBtn" class="btn btn-primary">Copy Script</button>
        </div>
        <div id="toast" class="toast">Copied to clipboard!</div>
    </div>

    <script>
        (function() {
            const copyBtn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');
            const scriptText = `loadstring(game:HttpGet("https://raw.githubusercontent.com/minecraftfornpm/Kohlsify/refs/heads/main/Kohlsify.lua"))()`;

            let timeoutId = null;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                if (timeoutId) clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    toast.classList.remove('show');
                    timeoutId = null;
                }, 2500);
            }

            copyBtn.addEventListener('click', async function() {
                try {
                    await navigator.clipboard.writeText(scriptText);
                    showToast('Copied to clipboard!');
                } catch (err) {
                    // Fallback for older browsers
                    const textarea = document.createElement('textarea');
                    textarea.value = scriptText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showToast('Copied to clipboard!');
                    } catch (e) {
                        showToast('Failed to copy. Please copy manually.');
                    }
                    document.body.removeChild(textarea);
                }
            });
        })();
    </script>
</body>
</html>
